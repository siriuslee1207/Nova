<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova 取名</title>
<link rel="stylesheet" href="css/nova.css">
</head>
<body>
<header class="top">
  <h1>Nova <span class="sub">小孩取名</span></h1>
  <p class="tag">五格數理・三才・八字喜用・生肖・音韻 — 離線單檔，資料不離開你的電腦</p>
</header>

<main class="layout">
  <section class="panel form" aria-labelledby="form-title">
    <h2 id="form-title">條件</h2>
    <form id="form" autocomplete="off">
      <div class="row">
        <label>姓氏 <input id="surname" name="surname" maxlength="2" placeholder="陳／歐陽" required></label>
        <div id="surname-info" class="chips" aria-live="polite"></div>
      </div>
      <div class="row two">
        <label>性別
          <select id="gender" name="gender"><option value="girl">女</option><option value="boy">男</option></select>
        </label>
        <label>字集
          <select id="level" name="level">
            <option value="1">常見取名用字</option>
            <option value="2" selected>常用字</option>
            <option value="3">含次常用字</option>
          </select>
        </label>
      </div>
      <div class="row two">
        <label>出生日期 <input id="born-date" name="born-date" type="date"></label>
        <label>出生時間 <input id="born-time" name="born-time" type="time"></label>
      </div>
      <div class="row inline">
        <label class="check"><input id="hour-unknown" type="checkbox"> 時辰不詳（只以年月日三柱計）</label>
      </div>
      <details class="adv">
        <summary>進階選項</summary>
        <div class="row two">
          <label>嚴格度
            <select id="strictness"><option value="strict">嚴格</option><option value="moderate" selected>一般</option><option value="relaxed">寬鬆</option></select>
          </label>
          <label>喜用神方法
            <select id="method"><option value="balance" selected>平衡法</option><option value="geju">格局法</option></select>
          </label>
        </div>
        <div class="row two">
          <label>結果數 <input id="topn" type="number" min="1" max="200" value="20"></label>
          <label>同一首字最多 <input id="perfirst" type="number" min="0" max="20" value="2"> 次（0 不限）</label>
        </div>
        <div class="row two">
          <label>指定第一字（輩字） <input id="fixed-first" maxlength="1"></label>
          <label>指定第二字 <input id="fixed-second" maxlength="1"></label>
        </div>
        <div class="row two">
          <label>排除字 <input id="avoid" placeholder="不想用的字，直接連寫"></label>
          <label>至少含其一 <input id="require" placeholder="希望出現的字"></label>
        </div>
        <div class="row inline">
          <label class="check"><input id="female-caution" type="checkbox"> 排除「女性不宜」總格（21、23、28、33）</label>
        </div>
      </details>
      <div class="row actions">
        <button type="submit" id="go" class="primary">產生名字</button>
        <span id="status" class="status" aria-live="polite"></span>
      </div>
    </form>

    <h2>單一名字評分</h2>
    <form id="explain-form" class="row inline">
      <input id="explain-name" maxlength="2" placeholder="輸入兩字名，如 冠宇">
      <button type="submit">評分</button>
    </form>

    <h2>AI 顧問</h2>
    <div id="ai" class="ai">
      <div class="row two">
        <label>供應商 <select id="ai-provider"></select></label>
        <label>模型 <input id="ai-model" placeholder="gemini-3.5-flash-lite"></label>
      </div>
      <div class="row"><label>API key <input id="ai-key" type="password" autocomplete="off" placeholder="貼上你自己的 key"></label></div>
      <div class="row"><label>給 AI 的偏好 <input id="ai-prefs" placeholder="例：希望字義與水、木有關，不要太文言"></label></div>
      <div id="ai-warn" class="chips" aria-live="polite"></div>
      <div class="row inline">
        <button type="button" id="ai-recommend">AI 推薦用字</button>
        <span id="ai-status" class="status" aria-live="polite"></span>
      </div>
      <p class="hint small">AI 只能從 Nova 已通過五格／三才篩選的字池中挑字，分數一律由 Nova 計算；key 由你的瀏覽器直接送到供應商，不經任何中間伺服器；key 與設定會自動存在這個瀏覽器，清空欄位即移除。</p>
    </div>
  </section>

  <section class="panel results" aria-live="polite">
    <div id="bazi" class="bazi" hidden></div>
    <div id="results"><p class="hint">輸入姓氏（與出生時間）後按「產生名字」。</p></div>
  </section>
</main>

<footer class="foot">
  <p>規則與評分移植自 <a href="https://github.com/babyname/fate">fate</a>（MIT），繁體資料以 Unihan、Big5 常用字重建；筆畫依康熙字典（姓名學）。分數僅供參考，不構成任何保證。</p>
  <p id="version"></p>
</footer>

<script src="../data/gen/tables.gen.js" id="nova-tables"></script>
<script src="../data/gen/chars.gen.js" id="nova-chars"></script>
<script src="../data/gen/prompts.gen.js" id="nova-prompts"></script>
<script src="vendor/lunar.js" id="nova-lunar"></script>
<script src="js/core/wuge.js"></script>
<script src="js/core/dayan.js"></script>
<script src="js/core/sancai.js"></script>
<script src="js/core/yinyun.js"></script>
<script src="js/core/chars.js"></script>
<script src="js/core/rating.js"></script>
<script src="js/core/bazi.js"></script>
<script src="js/core/generator.js"></script>
<script src="js/llm/provider.js"></script>
<script src="js/llm/gemini.js"></script>
<script src="js/llm/advisor.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
